services:
  - type: web
    name: climaguard-api
    runtime: python
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: 'off'
    envVars:
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://climaguard-ai.vercel.app
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: NUGEN_API_KEY
        sync: false
      - key: NUGEN_MODEL_ID
        sync: false
